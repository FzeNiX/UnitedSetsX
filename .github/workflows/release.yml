# Builds the portable zip and creates a *draft* GitHub release when a version tag (v1.2.3) is pushed.
# Review the draft on GitHub (Releases), edit the notes, then click "Publish release".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # windows-2025 has the Windows SDK 10.0.26100 the project needs
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build portable zip
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/publish.ps1 -Version $version

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*.zip
